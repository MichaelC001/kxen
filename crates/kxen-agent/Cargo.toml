[package]
name = "kxen-agent"
version = "0.1.8"
edition = "2024"
license = "MIT"
repository = "https://github.com/StringKe/kxen"
description = "Standalone non-interactive DCPAgent runtime for kxen"

[[bin]]
name = "kxen-agent"
path = "src/main.rs"

[dependencies]
kxen-core = { path = "../kxen-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
