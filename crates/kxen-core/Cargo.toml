[package]
name = "kxen-core"
version = "0.1.9"
edition = "2024"
license = "MIT"
repository = "https://github.com/StringKe/kxen"
description = "kxen core library: runtime, persistence, providers, tools, web server"

[lib]
name = "kxen_core"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
similar = "3"
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml_ng = "0.10"
tokio = { version = "1.53", features = [
  "rt-multi-thread",
  "macros",
  "fs",
  "process",
  "io-util",
  "time",
  "sync",
  "net",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "1"
thiserror = "2"
regex = "1.13"
ignore = "0.4"
globset = "0.4"
reqwest = { version = "0.13", default-features = false, features = [
  # rustls 已捆绑 rustls-platform-verifier（取代已移除的 rustls-native-certs）
  "rustls",
  "json",
  "stream",
  "multipart",
  "form",
  # websearch 的 query 参数编码（替手工 urlencode）
  "query",
] }
futures = "0.3"
axum = { version = "0.8", features = ["ws"] }
form_urlencoded = "1"
rust-embed = { version = "8", features = ["mime-guess"] }
dirs = "6"
base64 = "0.23"
time = { version = "0.3", features = ["parsing", "formatting"] }
rquickjs = { version = "0.12", features = ["futures"] }
cron = "0.17"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
trash = "5"
cap-std = "4.0.2"
# browser 工具的 CDP 驱动（系统 Chrome headless）；default-features 只含 bytes（screencast 用），关掉求最小依赖树；
# fetcher 特性不启用：只驱动本机已装 Chrome，不下载 Chromium
chromiumoxide = { version = "0.9", default-features = false }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.11"
# MCP OAuth 的 PKCE/state 熵源（跨平台 OS 随机，替 /dev/urandom）
getrandom = "0.4"
notify-rust = "4"

# voice 的 Speech.framework / AVFAudio 手写绑定（voice/objc.rs）只在 macOS 编译
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
block2 = "0.6"
