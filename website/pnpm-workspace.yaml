overrides:
  lodash-es: 4.18.1
  # GHSA-jmr9-qjv8-65gv：astro-icon 的 @iconify/tools 4.x 仍依赖没有安全版本可升级的 extract-zip。
  # @iconify/tools 5.x 已移除该依赖，并保留 astro-icon 使用的公开导出。
  "astro-icon>@iconify/tools": 5.0.12
  # GHSA-4cwx-7wf7-3272：astro-icon 链的 undici 跨用户信息泄露，audit 门禁要求 >=7.29.0
  undici: ">=7.29.0"
  # GHSA-5p4m-2wfm-xmqj：@astrojs/internal-helpers 链的 js-yaml !!omap 二次方 CPU 消耗，audit 门禁要求 >=4.3.1。
  # 锁 4.x：5.x 改为纯 ESM 无 default export，astro 7 的 CJS interop 不兼容。
  js-yaml: ">=4.3.1 <5.0.0"
  # postcss 链的 nanoid size=0 死循环（pnpm audit high 告警，影响 <3.3.17),audit 门禁要求 >=3.3.17
  nanoid: ">=3.3.17"
# Declines install scripts for esbuild and sharp (they ship prebuilds),
# clearing pnpm's build-scripts gate. Adding a package here lets it run scripts.
packages: []
allowBuilds:
  # pnpm 11
  esbuild: false
  sharp: false
  workerd: false
ignoredBuiltDependencies:
  # pnpm 10
  - esbuild
  - sharp
  - workerd
minimumReleaseAgeExclude:
  - miniflare@5.20260804.0-alpha
  - wrangler@4.120.1
