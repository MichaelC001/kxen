[package]
name = "kxen-gui"
version = "0.1.12"
edition = "2024"
license = "MIT"
repository = "https://github.com/StringKe/kxen"
description = "kxen desktop shell (Tauri): tray, window, updater; all product logic lives in kxen-core"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kxen-core = { path = "../crates/kxen-core" }
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
serde_json = "1"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros"] }
toml = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify-rust = "4"
# tray「复制访问链接」写系统剪贴板（tauri 2 core 无剪贴板 API，JS 插件路径在纯 Rust tray 侧不可用）
arboard = "3"
