name: 功能建议
description: 提议新能力或改进现有功能
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前遇到什么不便，谁会遇到，为什么现有行为不足？请描述问题，不要只写实现名称。
      placeholder: 当我在...场景中尝试...时，当前只能...，因此...
    validations:
      required: true
  - type: textarea
    id: use_cases
    attributes:
      label: 使用场景与边界
      description: 给出主要场景、输入、期望结果，以及明确不属于本需求的范围。
      placeholder: |
        主要场景:
        输入:
        期望结果:
        不在范围内:
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 希望 kxen 提供什么用户能力？涉及新 Provider、协议或托管平台时请附官方文档完整 URL。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 可验证的验收标准
      description: 使用可观察的 PASS/FAIL 条件描述完成状态，包括失败和恢复路径。
      placeholder: |
        - PASS: 当...时，系统...
        - FAIL: 当...时，系统不得...
        - Recovery: 中断后...
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: 权限、数据与成本边界
      description: 是否涉及 credential、外部写操作、用户数据、模型调用、预算或不可逆操作？没有也请写 `无`。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 哪些替代方案可以解决部分问题，为什么仍需要这个能力？
  - type: textarea
    id: evidence
    attributes:
      label: 补充证据
      description: 可提供截图、日志、原型、相关 Issue/PR 或同类产品链接。请先移除 token、API key 和个人数据。
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，未发现相同请求。
          required: true
        - label: 我没有在正文、截图或日志中提交 credential 或其他敏感信息。
          required: true
