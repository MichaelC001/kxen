name: Docker

# release 正式发布后才构建镜像：复用该 release 的 kxen CLI 资产，镜像内容与发布产物同源。
# draft/失败不会产生镜像；workflow_dispatch 用于为已发布版本补发。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 已发布的 release tag（如 v0.1.2）
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and push GHCR image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve release tag
        id: tag
        run: |
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { printf 'invalid tag: %s\n' "$tag" >&2; exit 1; }
          # GHCR 仓库路径必须全小写，github.repository 可能含大写 owner
          printf 'tag=%s\nversion=%s\nimage=ghcr.io/%s\n' "$tag" "${tag#v}" "$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Fetch kxen CLI assets from release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p context
          gh release download "$TAG" --pattern 'kxen-linux-x86_64.tar.gz' --pattern 'kxen-linux-aarch64.tar.gz' --dir context --clobber
          tar -xzf context/kxen-linux-x86_64.tar.gz -C context
          mv context/kxen context/kxen-amd64
          tar -xzf context/kxen-linux-aarch64.tar.gz -C context
          mv context/kxen context/kxen-arm64
          rm context/*.tar.gz
          test -x context/kxen-amd64 && test -x context/kxen-arm64
          cp Dockerfile context/

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: context
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}:latest
            ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.version }}
            ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.tag }}

      - name: Verify published manifest
        run: |
          docker buildx imagetools inspect "${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.tag }}" \
            | grep -E 'linux/amd64|linux/arm64'
