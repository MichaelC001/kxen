[workspace]
resolver = "2"
members = [
    "crates/kxen-core",
    "crates/kxen-llm",
    "crates/kxen-auth",
    "crates/kxen-tools",
    "crates/kxen-agent",
    "app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/StringKe/kxen"

[workspace.dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "fs", "process", "io-util", "time", "sync", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
regex = "1.13"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "rustls-native-certs", "json", "stream"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
