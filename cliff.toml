[changelog]
header = """
# Changelog

此文件由 [git-cliff](https://github.com/orhun/git-cliff) 根据 Git tag 和 Conventional Commits 自动生成，请勿手动编辑。

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}
{% for commit in commits %}\
{% for footer in commit.footers %}\
{% if footer.token == "Release-Title" %}\
> **版本主题:** {{ footer.value }}

{% endif %}\
{% endfor %}\
{% endfor %}\
{% set_global has_release_notes = false %}\
{% for commit in commits %}\
{% for footer in commit.footers %}\
{% if footer.token == "Release-Note" %}\
{% set_global has_release_notes = true %}\
{% endif %}\
{% endfor %}\
{% endfor %}\
{% if has_release_notes %}\
### 本次更新

{% for commit in commits %}\
{% for footer in commit.footers %}\
{% if footer.token == "Release-Note" %}\
- {{ footer.value }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/StringKe/kxen/commit/{{ commit.id }}))
{% endif %}\
{% endfor %}\
{% endfor %}\
{{ "\n" }}\
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}\
{% if group != "__release_metadata" %}\
### {{ group | striptags | trim }}

{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/StringKe/kxen/commit/{{ commit.id }}))
{% endfor %}
{% endif %}\
{% endfor %}\
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
sort_commits = "oldest"
commit_parsers = [
  # Release commit 必须保留在 template context 中读取产品 footer，但不进入技术明细。
  { message = "^chore\\(release\\)", group = "__release_metadata" },
  { message = "^feat", group = "新增功能" },
  { message = "^fix", group = "问题修复" },
  { message = "^perf", group = "性能优化" },
  { message = "^refactor", group = "架构与重构" },
  { message = "^chore\\(deps\\)", group = "依赖更新" },
  { message = "^docs", group = "文档" },
  { message = "^test", group = "测试" },
  { message = "^(ci|build)", group = "工程" },
  { message = "^(chore|style)", group = "维护" },
  { message = ".*", group = "其他变更" },
]
